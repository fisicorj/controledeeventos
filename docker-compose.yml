services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-arena_events}
      # O usuário criado pelo PostgreSQL é o dono das tabelas: DB_MIGRATE_USER quando a aplicação usa um papel
      # próprio (README, "Banco: dois papéis"); senão, o próprio DB_USER.
      POSTGRES_USER: ${DB_MIGRATE_USER:-${DB_USER:-arena_user}}
      POSTGRES_PASSWORD: ${DB_MIGRATE_PASSWORD:-${DB_PASSWORD:?DB_PASSWORD deve ser definida no .env}}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - arena_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  # Migrações e permissões do banco, uma vez a cada subida. É o único serviço que recebe a senha do dono das
  # tabelas (DB_MIGRATE_*): o web e o worker rodam só com o papel da aplicação (SEC-25 da 3ª auditoria).
  migrate:
    build: .
    profiles: ["prod"]
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
    command: ["sh", "-c", "python manage.py migrate --noinput && python manage.py setup_db_roles --if-configured"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web:
    build: .
    profiles: ["prod"]
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      # Quem envia os e-mails é o worker; o web só coloca na fila (não perde envio se o gunicorn reiniciar).
      OUTBOX_MODE: "off"
      # A senha do dono das tabelas fica só no serviço migrate (estas linhas valem mais que o .env).
      DB_MIGRATE_USER: ""
      DB_MIGRATE_PASSWORD: ""
    command: ["sh", "-c", "gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers ${GUNICORN_WORKERS:-3} --timeout ${GUNICORN_TIMEOUT:-120} --access-logfile -"]
    ports:
      - "8000:8000"
    volumes:
      - arena_media:/app/media
      - arena_private_media:/app/private_media
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(urllib.request.urlopen('http://127.0.0.1:8000/saude/', timeout=5).status != 200)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  worker:
    build: .
    profiles: ["prod"]
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_MIGRATE_USER: ""
      DB_MIGRATE_PASSWORD: ""
    # Os ZIPs de lotes grandes ficam com o serviço zips: os e-mails não esperam por eles.
    command: ["python", "manage.py", "process_outbox", "--continuo", "--sem-zips"]
    volumes:
      - arena_media:/app/media
      - arena_private_media:/app/private_media
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

  # ZIPs de lotes grandes da emissão avulsa (certificates/zips.py), separados da fila de e-mails.
  zips:
    build: .
    profiles: ["prod"]
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_MIGRATE_USER: ""
      DB_MIGRATE_PASSWORD: ""
    command: ["python", "manage.py", "process_outbox", "--continuo", "--so-zips"]
    volumes:
      - arena_media:/app/media
      - arena_private_media:/app/private_media
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  arena_postgres_data:
  arena_media:
  arena_private_media: