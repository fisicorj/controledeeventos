name: CI

on:
  push:
    branches: [main]
  pull_request:

# O token da CI só lê o repositório (SEC-20 da 2ª auditoria).
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: arena_events
          POSTGRES_USER: arena_user
          POSTGRES_PASSWORD: arena_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U arena_user"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SECRET_KEY: ci-only-not-a-real-secret-0123456789-abcdefghijklmnopqrstuv
      DEBUG: 'True'
      DB_NAME: arena_events
      DB_USER: arena_user
      DB_PASSWORD: arena_password
      DB_HOST: localhost
      DB_PORT: '5432'
      LOG_LEVEL: WARNING
    steps:
      # Ações fixadas pelo commit (uma etiqueta pode ser movida); o Dependabot atualiza o SHA e o comentário.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.txt
      - name: Instalar dependências (com conferência de hash, como no Dockerfile)
        run: |
          pip install --require-hashes -r requirements.lock
          pip install -r requirements-dev.txt
      - name: Navegador dos testes de interface (Playwright + Chromium)
        run: python -m playwright install --with-deps chromium
      - name: requirements.lock em dia com o requirements.txt
        # Recalcula a partir do lock atual (as versões já fixadas são mantidas) e compara. Se falhar, rode o
        # comando que está no início do requirements.lock e inclua o arquivo no commit.
        run: |
          cp requirements.lock /tmp/requirements.lock
          uv pip compile requirements.txt --python-version 3.12 --python-platform x86_64-manylinux_2_28 \
            --generate-hashes -q -o /tmp/requirements.lock \
            --custom-compile-command "$(sed -n 2p requirements.lock | sed 's/^#    //')"
          diff requirements.lock /tmp/requirements.lock
      - name: Padrão de código e regras de segurança (ruff)
        run: |
          ruff check .
          ruff format --check .
      - name: Dependências com vulnerabilidade conhecida (pip-audit)
        # Em dois comandos: o lock tem hashes e o arquivo de desenvolvimento não, e o pip recusa a mistura.
        run: |
          pip-audit -r requirements.lock --progress-spinner off
          pip-audit -r requirements-dev.txt --progress-spinner off
      - name: Migrações em dia
        run: python manage.py makemigrations --check --dry-run
      - name: Testes (com cobertura)
        run: |
          coverage run manage.py test
          coverage report --skip-covered
        # Inclui os testes de navegador e de acessibilidade (core/test_browser.py).

  # O que vai para a AWS: a imagem Docker precisa montar e os scripts de infraestrutura passar no shellcheck.
  deploy-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Scripts de infraestrutura e backup (shellcheck)
        run: shellcheck -S style infra/*.sh scripts/*.sh
      - name: Build da imagem Docker
        run: docker build -t arena-events:ci .
      - name: A aplicação carrega dentro da imagem
        run: |
          docker run --rm -e SECRET_KEY=ci-check-only-0123456789-abcdefghijklmnopqrstuvwxyz-0123 \
            -e DEBUG=False -e ALLOWED_HOSTS=localhost arena-events:ci python manage.py check
