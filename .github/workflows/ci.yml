name: CI

on:
  push:
    branches: [main]
  pull_request:

# O token da CI só lê o repositório (SEC-20 da 2ª auditoria).
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: arena_events
          POSTGRES_USER: arena_user
          POSTGRES_PASSWORD: arena_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U arena_user"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SECRET_KEY: ci-only-not-a-real-secret-0123456789-abcdefghijklmnopqrstuv
      DEBUG: 'True'
      DB_NAME: arena_events
      DB_USER: arena_user
      DB_PASSWORD: arena_password
      DB_HOST: localhost
      DB_PORT: '5432'
      LOG_LEVEL: WARNING
    steps:
      # Ações fixadas pelo commit (uma etiqueta pode ser movida); o Dependabot atualiza o SHA e o comentário.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Instalar dependências
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Padrão de código e regras de segurança (ruff)
        run: |
          ruff check .
          ruff format --check .
      - name: Dependências com vulnerabilidade conhecida (pip-audit)
        run: pip-audit -r requirements.txt -r requirements-dev.txt --progress-spinner off
      - name: Migrações em dia
        run: python manage.py makemigrations --check --dry-run
      - name: Testes (com cobertura)
        run: |
          coverage run manage.py test
          coverage report --skip-covered
