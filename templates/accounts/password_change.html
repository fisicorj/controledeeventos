{% extends 'base.html' %}
{% load ui %}
{% block title %}Trocar senha | {{ portal.portal_name }}{% endblock %}
{% block content %}
<main class="container" style="max-width:640px">
  <div class="page-head">
    <div class="crumbs"><a href="{% url 'profile' %}">Meus dados</a></div>
    <h1>Trocar senha</h1>
  </div>
  <form method="post" class="panel panel-body" novalidate>
    {% csrf_token %}
    {% include 'core/_form.html' with form=form %}
    <div class="d-flex gap-2 mt-4">
      <button class="btn btn-primary px-4">Trocar senha</button>
      <a class="btn btn-outline-secondary" href="{% url 'profile' %}">Cancelar</a>
    </div>
  </form>
  <p class="small text-secondary mt-3">Esqueceu a senha atual? <a href="{% url 'password_reset' %}">Receba um link por e-mail</a>.</p>
</main>
{% endblock %}
