{% load static %}
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="{{ portal.safe_primary_color }}">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Check-in">
  <link rel="manifest" href="{% url 'checkin_manifest' %}">
  <link rel="apple-touch-icon" href="{% static 'pwa/icon-192.png' %}">
  <link rel="stylesheet" href="{% static 'vendor/bootstrap/bootstrap.min.css' %}">
  <link rel="stylesheet" href="{% static 'vendor/public-sans/public-sans.css' %}">
  <link rel="stylesheet" href="{% static 'vendor/bootstrap-icons/bootstrap-icons.min.css' %}">
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  <style>:root { --brand: {{ portal.safe_primary_color }}; --brand-rgb: {{ portal.primary_rgb }}; --brand-contrast: {{ portal.primary_contrast }}; }</style>
  <script src="{% static 'js/checkin-sw.js' %}" data-sw="{% url 'checkin_sw' %}" data-scope="{% url 'checkin_home' %}" defer></script>
  <script src="{% static 'js/app.js' %}" defer></script>
